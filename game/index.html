<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치 기기에서 safe-area-inset 을 쓰려면 필요하다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04283f" />
    <!-- 모바일 웹뷰/홈화면 실행 시 브라우저 크롬 없이 전체화면으로 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coral Deep" />
    <!-- 숫자를 전화번호로 자동 링크하지 않게 (iOS 웹뷰) -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
    <title>Coral Deep — 심해 수족관</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
