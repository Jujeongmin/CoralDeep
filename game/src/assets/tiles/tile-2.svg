  <path d="M36.5 50 L22.75 104" stroke="#06381f" stroke-width="5" opacity="0.42" stroke-linecap="round"/><path d="M49 39 L41.5 104" stroke="#06381f" stroke-width="5" opacity="0.42" stroke-linecap="round"/><path d="M62.5 33 L61.75 104" stroke="#06381f" stroke-width="5" opacity="0.42" stroke-linecap="round"/><path d="M77 36 L83.5 104" stroke="#06381f" stroke-width="5" opacity="0.42" stroke-linecap="round"/><path d="M90.5 46 L103.75 104" stroke="#06381f" stroke-width="5" opacity="0.42" stroke-linecap="round"/><path d="M30 56 L16.400000000000006 102" stroke="#bdffd9" stroke-width="3" opacity="0.26" stroke-linecap="round"/><path d="M43 44 L34.6 102" stroke="#bdffd9" stroke-width="3" opacity="0.26" stroke-linecap="round"/><path d="M55 34 L51.4 102" stroke="#bdffd9" stroke-width="3" opacity="0.26" stroke-linecap="round"/><path d="M70 32 L72.4 102" stroke="#bdffd9" stroke-width="3" opacity="0.26" stroke-linecap="round"/><path d="M84 40 L92 102" stroke="#bdffd9" stroke-width="3" opacity="0.26" stroke-linecap="round"/><path d="M97 52 L110.19999999999999 102" stroke="#bdffd9" stroke-width="3" opacity="0.26" stroke-linecap="round"/><ellipse cx="30" cy="59" rx="6.5" ry="3.6" fill="#d9fff0" opacity="0.5"/><ellipse cx="30" cy="59.4" rx="4" ry="2.1" fill="#04301a" opacity="0.55"/><ellipse cx="43" cy="47" rx="6.5" ry="3.6" fill="#d9fff0" opacity="0.5"/><ellipse cx="43" cy="47.4" rx="4" ry="2.1" fill="#04301a" opacity="0.55"/><ellipse cx="55" cy="37" rx="6.5" ry="3.6" fill="#d9fff0" opacity="0.5"/><ellipse cx="55" cy="37.4" rx="4" ry="2.1" fill="#04301a" opacity="0.55"/><ellipse cx="70" cy="35" rx="6.5" ry="3.6" fill="#d9fff0" opacity="0.5"/><ellipse cx="70" cy="35.4" rx="4" ry="2.1" fill="#04301a" opacity="0.55"/><ellipse cx="84" cy="43" rx="6.5" ry="3.6" fill="#d9fff0" opacity="0.5"/><ellipse cx="84" cy="43.4" rx="4" ry="2.1" fill="#04301a" opacity="0.55"/><ellipse cx="97" cy="55" rx="6.5" ry="3.6" fill="#d9fff0" opacity="0.5"/><ellipse cx="97" cy="55.4" rx="4" ry="2.1" fill="#04301a" opacity="0.55"/>
  <g filter="url(#aoc2)"><path d="M18 92 q0 -26 12 -38 q9 -9 13 3 q3 -20 12 -8 q5 -22 15 -6 q6 -20 15 -4 q6 -14 13 4 q6 -10 12 4 q10 13 10 45 q-51 22 -102 0Z" fill="#000"/></g>
  <g filter="url(#rimc2)"><path d="M18 92 q0 -26 12 -38 q9 -9 13 3 q3 -20 12 -8 q5 -22 15 -6 q6 -20 15 -4 q6 -14 13 4 q6 -10 12 4 q10 13 10 45 q-51 22 -102 0Z" fill="#000"/></g>
  <g filter="url(#inc2)"><path d="M18 92 q0 -26 12 -38 q9 -9 13 3 q3 -20 12 -8 q5 -22 15 -6 q6 -20 15 -4 q6 -14 13 4 q6 -10 12 4 q10 13 10 45 q-51 22 -102 0Z" fill="#000"/></g>
</g>
<!-- 어두운 외곽선: 물 위에서도 타일이 또렷하게 떨어져 보인다 -->
<path d="M18 92 q0 -26 12 -38 q9 -9 13 3 q3 -20 12 -8 q5 -22 15 -6 q6 -20 15 -4 q6 -14 13 4 q6 -10 12 4 q10 13 10 45 q-51 22 -102 0Z" fill="none" stroke="#05161f" stroke-opacity="0.55" stroke-width="4"/><ellipse cx="44" cy="42" rx="24" ry="14" fill="url(#glossG)" opacity="0.85" transform="rotate(-20 44 42)"/><ellipse cx="38" cy="37.8" rx="8.2" ry="5.9" fill="#ffffff" opacity="0.95" transform="rotate(-20 44 42)"/></svg>
