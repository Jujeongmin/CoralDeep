<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><defs>

<filter id="shc2" x="-30%" y="-30%" width="160%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#04141f" flood-opacity="0.55"/>
</filter>

<!-- 위쪽 베벨: 빛을 받는 면 -->
<filter id="inc2" x="-20%" y="-20%" width="140%" height="140%">
  <feOffset dx="-2" dy="-7" in="SourceAlpha" result="o"/>
  <feGaussianBlur in="o" stdDeviation="4" result="b"/>
  <feComposite in="SourceAlpha" in2="b" operator="out" result="inner"/>
  <feFlood flood-color="#ffffff" flood-opacity="0.9"/>
  <feComposite in2="inner" operator="in"/>
</filter>
<!-- 아래쪽 그늘 -->
<filter id="aoc2" x="-20%" y="-20%" width="140%" height="140%">
  <feOffset dx="2" dy="8" in="SourceAlpha" result="o"/>
  <feGaussianBlur in="o" stdDeviation="7" result="b"/>
  <feComposite in="SourceAlpha" in2="b" operator="out" result="inner"/>
  <feFlood flood-color="#000814" flood-opacity="0.62"/>
  <feComposite in2="inner" operator="in"/>
</filter>
<!-- 바닥 반사광(림라이트): 이게 있어야 물속에 떠 있는 입체로 보인다 -->
<filter id="rimc2" x="-20%" y="-20%" width="140%" height="140%">
  <feOffset dx="0" dy="11" in="SourceAlpha" result="o"/>
  <feGaussianBlur in="o" stdDeviation="2.5" result="b"/>
  <feComposite in="SourceAlpha" in2="b" operator="out" result="inner"/>
  <feFlood flood-color="#9fe8ff" flood-opacity="0.5"/>
  <feComposite in2="inner" operator="in"/>
</filter>

<radialGradient id="glossG" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
  <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.35"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bodyc2" x1="0.2" y1="-0.05" x2="0.8" y2="1.05">
  <stop offset="0" stop-color="#9df5c0"/>
  <stop offset="0.34" stop-color="#42d183"/>
  <stop offset="1" stop-color="#137a45"/>
</linearGradient>
<clipPath id="clipc2"><path d="M18 92 q0 -26 12 -38 q9 -9 13 3 q3 -20 12 -8 q5 -22 15 -6 q6 -20 15 -4 q6 -14 13 4 q6 -10 12 4 q10 13 10 45 q-51 22 -102 0Z" fill="none"/></clipPath>
</defs>
<g filter="url(#shc2)">
  <path d="M18 92 q0 -26 12 -38 q9 -9 13 3 q3 -20 12 -8 q5 -22 15 -6 q6 -20 15 -4 q6 -14 13 4 q6 -10 12 4 q10 13 10 45 q-51 22 -102 0Z" fill="url(#bodyc2)"/>
</g>
