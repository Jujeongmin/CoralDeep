<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><defs>

<filter id="shb4" x="-30%" y="-30%" width="160%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#04141f" flood-opacity="0.55"/>
</filter>

<!-- 위쪽 베벨: 빛을 받는 면 -->
<filter id="inb4" x="-20%" y="-20%" width="140%" height="140%">
  <feOffset dx="-2" dy="-7" in="SourceAlpha" result="o"/>
  <feGaussianBlur in="o" stdDeviation="4" result="b"/>
  <feComposite in="SourceAlpha" in2="b" operator="out" result="inner"/>
  <feFlood flood-color="#ffffff" flood-opacity="0.42"/>
  <feComposite in2="inner" operator="in"/>
</filter>
<!-- 아래쪽 그늘 -->
<filter id="aob4" x="-20%" y="-20%" width="140%" height="140%">
  <feOffset dx="2" dy="8" in="SourceAlpha" result="o"/>
  <feGaussianBlur in="o" stdDeviation="7" result="b"/>
  <feComposite in="SourceAlpha" in2="b" operator="out" result="inner"/>
  <feFlood flood-color="#000814" flood-opacity="0.62"/>
  <feComposite in2="inner" operator="in"/>
</filter>
<!-- 바닥 반사광(림라이트): 이게 있어야 물속에 떠 있는 입체로 보인다 -->
<filter id="rimb4" x="-20%" y="-20%" width="140%" height="140%">
  <feOffset dx="0" dy="11" in="SourceAlpha" result="o"/>
  <feGaussianBlur in="o" stdDeviation="2.5" result="b"/>
  <feComposite in="SourceAlpha" in2="b" operator="out" result="inner"/>
  <feFlood flood-color="#7fc4dd" flood-opacity="0.22"/>
  <feComposite in2="inner" operator="in"/>
</filter>

