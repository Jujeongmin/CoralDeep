  <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.35"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bodyb4" x1="0.2" y1="-0.05" x2="0.8" y2="1.05">
